<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Fatigue Detector</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 80%; max-width: 600px; text-align: center; }
        textarea { width: 100%; height: 150px; margin: 1rem 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background-color: #6c5ce7; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        #result { margin-top: 1rem; font-weight: bold; color: #2d3436; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Cognitive Fatigue Detector</h1>
        <p>Type the text below to analyze your fatigue level.</p>
        <textarea id="typingArea" placeholder="Start typing here..."></textarea>
        <br>
        <button onclick="analyzeFatigue()">🔍 Analyze Fatigue Level</button>
        <div id="result"></div>
    </div>

    <script>
        let startTime;
        let lastKeyTime;
        let intervals = [];

        const typingArea = document.getElementById('typingArea');
        typingArea.addEventListener('keydown', (e) => {
            const currentTime = Date.now();
            if (!startTime) startTime = currentTime;
            if (lastKeyTime) {
                intervals.push(currentTime - lastKeyTime);
            }
            lastKeyTime = currentTime;
        });

        async function analyzeFatigue() {
            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intervals: intervals })
            });
            const data = await response.json();
            document.getElementById('result').innerText = "Fatigue Score: " + data.fatigue_score + " (" + data.status + ")";
        }
    </script>
</body>
</html>
