<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Engineer Fatigue Detector</title>
    <style>
        body { font-family: 'Consolas', monospace; background-color: #1e1e1e; color: #d4d4d4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #252526; padding: 2rem; border-radius: 8px; border: 1px solid #333; width: 90%; max-width: 500px; text-align: center; }
        h1 { color: #569cd6; font-size: 1.5rem; }
        textarea { width: 100%; height: 150px; background: #1e1e1e; color: #9cdcfe; border: 1px solid #3e3e42; padding: 12px; border-radius: 4px; font-family: 'Consolas', monospace; box-sizing: border-box; }
        button { background-color: #0e639c; color: white; border: none; padding: 10px 20px; border-radius: 2px; cursor: pointer; margin-top: 1rem; width: 100%; }
        button:hover { background-color: #1177bb; }
        #result { margin-top: 1.5rem; font-size: 1.1rem; }
        .score-val { color: #ce9178; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>// Fatigue_Detector.exe</h1>
        <p>Type a code snippet or thoughts to check your flow state.</p>
        <textarea id="typingArea" placeholder="const developerStatus = 'exhausted'; ..."></textarea>
        <button onclick="analyzeFatigue()">Run Analysis</button>
        <div id="result"></div>
    </div>

    <script>
        let lastKeyTime;
        let intervals = [];
        const area = document.getElementById('typingArea');

        area.addEventListener('keydown', () => {
            const now = Date.now();
            if (lastKeyTime) intervals.push(now - lastKeyTime);
            lastKeyTime = now;
        });

        async function analyzeFatigue() {
            if (intervals.length < 10) {
                document.getElementById('result').innerText = "Insufficient input for analysis.";
                return;
            }

            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intervals: intervals })
            });
            
            const data = await response.json();
            // This line specifically fixes the 'undefined' error
            document.getElementById('result').innerHTML = 
                `System Report: <span class="score-val">${data.fatigue_score}%</span><br>Status: ${data.status}`;
        }
    </script>
</body>
</html>
