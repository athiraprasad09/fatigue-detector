<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Fatigue Monitor</title>
    <style>
        :root { --accent: #007acc; --danger: #f44336; --success: #4caf50; --bg: #1e1e1e; }
        body { 
            font-family: 'Segoe UI', monospace; background-color: var(--bg); color: #d4d4d4;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .container { 
            background: #252526; padding: 2.5rem; border-radius: 12px; border: 1px solid #3c3c3c;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 90%; max-width: 700px;
        }
        .header { border-bottom: 1px solid #3c3c3c; padding-bottom: 15px; margin-bottom: 20px; text-align: left; }
        h1 { margin: 0; color: var(--accent); font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        .stat-item { background: #2d2d2d; padding: 10px 15px; border-radius: 4px; flex: 1; text-align: center; border: 1px solid #3c3c3c; }
        .stat-label { font-size: 0.6rem; color: #858585; text-transform: uppercase; display: block; }
        .stat-value { font-size: 1.1rem; font-weight: bold; color: #9cdcfe; }

        textarea { 
            width: 100%; height: 220px; background: #1e1e1e; color: #ce9178; border: 1px solid #3c3c3c;
            border-radius: 4px; padding: 15px; font-family: 'Consolas', monospace; resize: none; box-sizing: border-box;
        }
        textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
        
        .btn { 
            background: var(--accent); color: white; border: none; padding: 12px; width: 100%;
            margin-top: 20px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s;
        }
        .btn:hover { background: #005a9e; }
        
        #output-card { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; background: #2d2d2d; border-left: 4px solid var(--accent); }
        .status-text { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .suggestion-text { color: #b5cea8; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><span>{ }</span> Cognitive_Fatigue_Monitor.v1</h1>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item"><span class="stat-label">Keystrokes</span><span id="keys">0</span></div>
            <div class="stat-item"><span class="stat-label">Jitter (ms)</span><span id="jitter">-</span></div>
            <div class="stat-item"><span class="stat-label">Latency</span><span id="latency">-</span></div>
        </div>

        <textarea id="editor" placeholder="// Type code here to begin diagnostic flow analysis..."></textarea>
        
        <button class="btn" onclick="runDiagnostic()">RUN DIAGNOSTIC ANALYSIS</button>
        
        <div id="output-card">
            <div id="status-title" class="status-text"></div>
            <div id="suggestion-body" class="suggestion-text"></div>
        </div>
    </div>

    <script>
        let intervals = [];
        let lastTime;
        let backspaces = 0;

        const editor = document.getElementById('editor');
        editor.addEventListener('keydown', (e) => {
            const now = Date.now();
            if (e.key === 'Backspace') backspaces++;
            
            if (lastTime) {
                const diff = now - lastTime;
                if (diff < 2000) {
                    intervals.push(diff);
                    document.getElementById('keys').innerText = intervals.length;
                    document.getElementById('latency').innerText = diff + "ms";
                }
            }
            lastTime = now;
        });

        async function runDiagnostic() {
            if (intervals.length < 5) return alert("Insufficient data strings.");

            const res = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    intervals: intervals, 
                    backspaces: backspaces,
                    text: editor.value 
                })
            });
            
            const data = await res.json();
            const card = document.getElementById('output-card');
            card.style.display = "block";
            document.getElementById('status-title').innerText = "REPORT: " + data.status;
            document.getElementById('suggestion-body').innerText = "ACTION: " + data.suggestion;

            // Color Coding for Teacher Impression
            if (data.status.includes("CRITICAL")) card.style.borderLeftColor = "#f44336";
            else if (data.status.includes("OPTIMAL")) card.style.borderLeftColor = "#4caf50";
            else if (data.status.includes("ERROR")) card.style.borderLeftColor = "#ff9800";
        }
    </script>
</body>
</html>
