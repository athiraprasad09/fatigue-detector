<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Fatigue Detector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            background: linear-gradient(135deg, #7c72f1 0%, #5a4db8 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: #2d3748;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 650px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 5px;
        }
        .header h2 { margin: 0; font-size: 1.8rem; color: #1a202c; }
        .status-dot { width: 8px; height: 8px; background: #48bb78; border-radius: 50%; display: inline-block; }
        .subtitle { font-size: 0.9rem; color: #a0aec0; margin-bottom: 25px; display: flex; align-items: center; gap: 8px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: #f7fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #edf2f7;
            text-align: center;
        }
        .stat-val { font-size: 1.6rem; font-weight: 600; color: #5a67d8; display: block; }
        .stat-label { font-size: 0.75rem; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-top: 4px; }
        
        textarea {
            width: 100%;
            height: 220px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            resize: none;
            box-sizing: border-box;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4a5568;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #667eea; }
        
        .analyze-btn {
            margin-top: 25px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .analyze-btn:hover { opacity: 0.95; }
        .analyze-btn:active { transform: scale(0.98); }
        
        .footer-text {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>🧠</span>
        <h2>Cognitive Fatigue Detector</h2>
    </div>
    <div class="subtitle">
        <span class="status-dot"></span> Real-time typing pattern analysis
    </div>
    
    <div class="stats-grid">
        <div class="stat-box">
            <span id="keystrokes" class="stat-val">0</span>
            <span class="stat-label">Keystrokes</span>
        </div>
        <div class="stat-box">
            <span id="avg-speed" class="stat-val">-</span>
            <span class="stat-label">Avg Speed (ms)</span>
        </div>
        <div class="stat-box">
            <span id="session-time" class="stat-val">0s</span>
            <span class="stat-label">Session Time</span>
        </div>
    </div>

    <textarea id="typingArea" placeholder="Start typing your code here... The system will monitor your typing patterns to detect cognitive fatigue."></textarea>
    
    <button class="analyze-btn" onclick="calculateFatigue()">🔍 Analyze Fatigue Level</button>
    
    <div class="footer-text">Developed by Bread Butter Club • Creative & Technical Studio</div>
</div>

<script>
    let keyCount = 0;
    let startTime = null;
    let lastKeyTime = null;
    let intervals = [];
    let timerInterval = null;

    const typingArea = document.getElementById('typingArea');
    const keystrokeDisplay = document.getElementById('keystrokes');
    const speedDisplay = document.getElementById('avg-speed');
    const timeDisplay = document.getElementById('session-time');

    typingArea.addEventListener('keydown', (e) => {
        const now = Date.now();
        
        if (!startTime) {
            startTime = now;
            timerInterval = setInterval(updateTimer, 1000);
        }

        if (lastKeyTime) {
            const diff = now - lastKeyTime;
            // Ignore intervals that are too long (pauses) to keep data clean
            if (diff < 3000) {
                intervals.push(diff);
                const avg = intervals.reduce((a, b) => a + b) / intervals.length;
                speedDisplay.innerText = Math.round(avg);
            }
        }

        lastKeyTime = now;
        keyCount++;
        keystrokeDisplay.innerText = keyCount;
    });

    function updateTimer() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        timeDisplay.innerText = elapsed + 's';
    }

    async function calculateFatigue() {
        if (intervals.length < 10) {
            alert("Please type a bit more (at least 10-15 keystrokes) for a better analysis.");
            return;
        }
        
        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intervals: intervals })
            });
            const result = await response.json();
            
            alert(`Analysis Result:
------------------
Status: ${result.message}
Fatigue Score: ${result.fatigue_score}%`);
        } catch (error) {
            console.error("Error connecting to backend:", error);
            alert("Could not connect to the Python backend. Make sure app.py is running!");
        }
    }
</script>

</body>
</html>
